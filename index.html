<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Yılan Oyunu</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: #0d1117;
    color: #f0f6fc;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }
  h1 {
    font-size: 24px;
    margin-bottom: 8px;
    color: #58a6ff;
  }
  .score-board {
    font-size: 16px;
    margin-bottom: 16px;
    color: #8b949e;
  }
  .score-board span {
    color: #3fb950;
    font-weight: bold;
  }
  canvas {
    background-color: #161b22;
    border: 2px solid #30363d;
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  /* Mobil Kontrol Butonları */
  .controls {
    display: grid;
    grid-template-columns: repeat(3, 50px);
    grid-template-rows: repeat(2, 50px);
    gap: 8px;
    margin-top: 20px;
  }
  .btn {
    background: #21262d;
    border: 1px solid #30363d;
    color: #f0f6fc;
    font-size: 18px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    cursor: pointer;
  }
  .btn:active {
    background: #30363d;
  }
  .btn-up { grid-column: 2; grid-row: 1; }
  .btn-left { grid-column: 1; grid-row: 2; }
  .btn-down { grid-column: 2; grid-row: 2; }
  .btn-right { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>

  <h1>🐍 Neon Yılan</h1>
  <div class="score-board">Skor: <span id="score">0</span></div>

  <canvas id="gameCanvas" width="300" height="300"></canvas>

  <!-- Mobil / Tıklamalı Kontroller -->
  <div class="controls">
    <div class="btn btn-up" onclick="changeDir('UP')">▲</div>
    <div class="btn btn-left" onclick="changeDir('LEFT')">◄</div>
    <div class="btn btn-down" onclick="changeDir('DOWN')">▼</div>
    <div class="btn btn-right" onclick="changeDir('RIGHT')">►</div>
  </div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");
  const scoreElement = document.getElementById("score");

  const gridSize = 15;
  const tileCount = canvas.width / gridSize;

  let snake = [{ x: 10, y: 10 }];
  let food = { x: 5, y: 5 };
  let dx = 1;
  let dy = 0;
  let score = 0;
  let gameInterval;
  let changingDirection = false;

  function main() {
    if (hasGameEnded()) {
      alert(`Oyun Bitti! Toplam Skorun: ${score}`);
      resetGame();
      return;
    }

    changingDirection = false;
    clearCanvas();
    drawFood();
    moveSnake();
    drawSnake();
  }

  function clearCanvas() {
    ctx.fillStyle = "#161b22";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function drawSnake() {
    snake.forEach((part, index) => {
      ctx.fillStyle = index === 0 ? "#58a6ff" : "#1f6feb";
      ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
    });
  }

  function moveSnake() {
    const head = { x: snake[0].x + dx, y: snake[0].y + dy };
    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreElement.innerText = score;
      generateFood();
    } else {
      snake.pop();
    }
  }

  function generateFood() {
    food.x = Math.floor(Math.random() * tileCount);
    food.y = Math.floor(Math.random() * tileCount);
  }

  function drawFood() {
    ctx.fillStyle = "#2ea043";
    ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
  }

  function hasGameEnded() {
    for (let i = 4; i < snake.length; i++) {
      if (snake[i].x === snake[0].x && snake[i].y === snake[0].y) return true;
    }
    const hitLeftWall = snake[0].x < 0;
    const hitRightWall = snake[0].x >= tileCount;
    const hitToptWall = snake[0].y < 0;
    const hitBottomWall = snake[0].y >= tileCount;

    return hitLeftWall || hitRightWall || hitToptWall || hitBottomWall;
  }

  function changeDir(direction) {
    if (changingDirection) return;

    const goingUp = dy === -1;
    const goingDown = dy === 1;
    const goingRight = dx === 1;
    const goingLeft = dx === -1;

    if (direction === 'LEFT' && !goingRight) { dx = -1; dy = 0; changingDirection = true; }
    if (direction === 'UP' && !goingDown) { dx = 0; dy = -1; changingDirection = true; }
    if (direction === 'RIGHT' && !goingLeft) { dx = 1; dy = 0; changingDirection = true; }
    if (direction === 'DOWN' && !goingUp) { dx = 0; dy = 1; changingDirection = true; }
  }

  // Klavye Kontrolleri
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a") changeDir('LEFT');
    if (e.key === "ArrowUp" || e.key === "w") changeDir('UP');
    if (e.key === "ArrowRight" || e.key === "d") changeDir('RIGHT');
    if (e.key === "ArrowDown" || e.key === "s") changeDir('DOWN');
  });

  function resetGame() {
    snake = [{ x: 10, y: 10 }];
    dx = 1;
    dy = 0;
    score = 0;
    scoreElement.innerText = score;
    generateFood();
  }

  // Oyunu başlat (Her 100ms'de bir kare yenilenir)
  generateFood();
  setInterval(main, 100);
</script>

</body>
</html>
