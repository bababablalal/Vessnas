<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in to GitHub</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
    background:#0d1117;color:#f0f6fc;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:40px 16px
  }
  .logo{margin-bottom:24px}
  .logo svg{fill:#f0f6fc}
  .title{font-size:24px;font-weight:300;margin-bottom:16px;letter-spacing:-0.5px}
  .container{width:100%;max-width:340px}
  .box{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:16px;margin-bottom:16px}
  .label{font-size:14px;margin-bottom:8px;font-weight:400}
  .input{
    width:100%;padding:5px 12px;height:32px;background:#0d1117;border:1px solid #30363d;
    border-radius:6px;color:#f0f6fc;font-size:14px;margin-bottom:16px
  }
  .input:focus{outline:none;border-color:#1f6feb;box-shadow:0 0 0 3px rgba(31,116,235,0.3)}
  .btn{
    width:100%;padding:5px 16px;height:32px;background:#238636;border:1px solid rgba(240,246,252,0.1);
    border-radius:6px;color:#fff;font-size:14px;font-weight:600;cursor:pointer
  }
  .btn:hover{background:#2ea043}
  .pass-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .link{color:#58a6ff;text-decoration:none;font-size:12px}
  .link:hover{text-decoration:underline}
  .footer{font-size:12px;color:#7d8590;text-align:center;border:1px solid #30363d;border-radius:6px;padding:16px}
  .footer a{color:#58a6ff;margin:0 8px;text-decoration:none}
  .messi{
    text-align:center;margin-bottom:20px;font-size:28px;font-weight:700;
    background:linear-gradient(90deg,#00a6ff,#ffd700);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    letter-spacing:1px
  }
</style>
</head>
<body>
  <div class="logo">
    <svg height="48" width="48" viewBox="0 0 16 16">
      <path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.75.75 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"></path>
    </svg>
  </div>

  <div class="messi">messi askim</div>
  <h1 class="title">Sign in to GitHub</h1>

  <div class="container">
    <div class="box">
      <label class="label" for="login">Username or email address</label>
      <input class="input" type="text" id="login" autocomplete="username">

      <div class="pass-row">
        <label class="label" for="password">Password</label>
        <a href="#" class="link">Forgot password?</a>
      </div>
      <input class="input" type="password" id="password" autocomplete="current-password">

      <button class="btn" type="submit">Sign in</button>
    </div>

    <div class="footer">
      New to GitHub? <a href="#">Create an account</a>.
    </div>
  </div>
</body>
</html>
