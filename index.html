<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Art Converter - Premium Dark Green</title>
  <style>
    :root {
      --bg-color: #040d08;
      --card-bg: #091e14;
      --card-inner-bg: #0f2d1e;
      --accent-color: #00ff75;
      --accent-hover: #50ff9c;
      --text-color: #f0fdf4;
      --text-muted: #86efac;
      --border-color: #00ff7540;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin: 15px 0 25px 0;
      color: var(--accent-color);
      text-shadow: 0 0 12px rgba(0, 255, 117, 0.4);
      text-align: center;
      font-size: 32px;
      letter-spacing: 1px;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      max-width: 950px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
      background: var(--card-inner-bg);
      padding: 20px;
      border-radius: 12px;
      border: 1px solid rgba(0, 255, 117, 0.15);
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-weight: 600;
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    input[type="file"], select, input[type="number"], input[type="range"] {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid rgba(0, 255, 117, 0.2);
      background: #05140c;
      color: #FFFFFF;
      font-size: 14px;
      outline: none;
      width: 100%;
      transition: all 0.2s;
    }

    input[type="file"]::file-selector-button {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-right: 10px;
    }

    select:focus, input[type="number"]:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 8px rgba(0,255,117,0.3);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .checkbox-group input {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: var(--accent-color);
    }

    .dim-inputs {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .preview-container {
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      background: #020905;
      border: 2px dashed rgba(0, 255, 117, 0.25);
      min-height: 350px;
      max-height: 520px;
      border-radius: 12px;
      padding: 20px;
    }

    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      max-width: 100%;
      max-height: 480px;
      border-radius: 4px;
      box-shadow: 0 0 20px rgba(0,0,0,0.9);
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .download-btn {
      flex: 1;
      min-width: 220px;
      background: var(--accent-color);
      color: #000000;
      border: none;
      padding: 14px 20px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 255, 117, 0.2);
    }

    .download-btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 255, 117, 0.4);
    }

    .download-btn.secondary {
      background-color: #123d27;
      color: #ffffff;
      border: 1px solid var(--border-color);
      box-shadow: none;
    }

    .download-btn.secondary:hover {
      background-color: #1a5637;
    }

    .palette-info {
      margin-top: 16px;
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    .resolution-info {
      font-size: 14px;
      color: var(--accent-color);
      font-weight: bold;
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>👾 Pixel Art Converter</h1>

  <div class="container">
    <div class="controls">
      
      <!-- 1. Görsel Yükle -->
      <div class="control-group">
        <label for="imageLoader">Görsel Yükle:</label>
        <input type="file" id="imageLoader" accept="image/*">
      </div>

      <!-- 2. Hazır Çözünürlük Seçimi -->
      <div class="control-group">
        <label for="presetSelect">Hazır Çözünürlük:</label>
        <select id="presetSelect">
          <option value="custom">Özel Boyut (Slider / Manuel)</option>
          <option value="16">16 x 16 (İkon)</option>
          <option value="24">24 x 24</option>
          <option value="32" selected>32 x 32 (Standart Pixel)</option>
          <option value="48">48 x 48</option>
          <option value="64">64 x 64</option>
          <option value="96">96 x 96</option>
          <option value="128">128 x 128 (Detaylı Pixel)</option>
          <option value="256">256 x 256</option>
        </select>
      </div>

      <!-- 3. Piksel Hassasiyeti Slider -->
      <div class="control-group">
        <label for="pixelSlider">Piksel Yoğunluğu: <span id="sliderValue" style="color:var(--accent-color);">32</span> px</label>
        <input type="range" id="pixelSlider" min="8" max="256" value="32">
      </div>

      <!-- 4. Manuel Boyut -->
      <div class="control-group">
        <label>Manuel Boyut (G x Y):</label>
        <div class="dim-inputs">
          <input type="number" id="widthInput" value="32" min="4" max="1024">
          <span>x</span>
          <input type="number" id="heightInput" value="32" min="4" max="1024">
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="aspectRatioCheck" checked>
          <label for="aspectRatioCheck" style="font-size:11px; text-transform:none;">Oranı Koru</label>
        </div>
      </div>

    </div>

    <!-- Önizleme Alanı -->
    <div class="preview-container">
      <canvas id="canvas"></canvas>
    </div>

    <div class="resolution-info" id="resolutionInfo">Aktif Çözünürlük: 32 x 32 px</div>

    <!-- İndirme Seçenekleri -->
    <div class="btn-group">
      <button class="download-btn" id="downloadNativeBtn">Birebir Çözünürlükte İndir (Gerçek Pixel)</button>
      <button class="download-btn secondary" id="downloadHDBtn">Net Büyütülmüş İndir (1024px HD)</button>
    </div>

    <div class="palette-info">Özel Renk Paleti: 30 Renk Matrix</div>
  </div>

  <script>
    const hexPalette = [
      "#FFFFFF", "#593D29", "#E3E4E5", "#F7E1B5",
      "#CCCCCC", "#FFFF80", "#7F7F7F", "#E5D900",
      "#4C4C4C", "#8CE63A", "#000000", "#00CD00",
      "#FFA0A0", "#5C7835", "#FF80C0", "#006B1F",
      "#FF3399", "#CCE5FF", "#FF5555", "#00CCE5",
      "#FF0000", "#0080D0", "#800000", "#0000FF",
      "#FF9955", "#101B7A", "#E59000", "#CD78EA",
      "#9A643E", "#800080"
    ];

    const rgbPalette = hexPalette.map(hex => {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return [r, g, b];
    });

    const imageLoader = document.getElementById('imageLoader');
    const presetSelect = document.getElementById('presetSelect');
    const pixelSlider = document.getElementById('pixelSlider');
    const sliderValue = document.getElementById('sliderValue');
    const widthInput = document.getElementById('widthInput');
    const heightInput = document.getElementById('heightInput');
    const aspectRatioCheck = document.getElementById('aspectRatioCheck');
    const resolutionInfo = document.getElementById('resolutionInfo');

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const downloadNativeBtn = document.getElementById('downloadNativeBtn');
    const downloadHDBtn = document.getElementById('downloadHDBtn');

    let img = new Image();
    let originalAspectRatio = 1;
    let isImageLoaded = false;

    imageLoader.addEventListener('change', (e) => {
      const reader = new FileReader();
      reader.onload = (event) => {
        img = new Image();
        img.onload = () => {
          isImageLoaded = true;
          originalAspectRatio = img.width / img.height;
          updateDimensionsFromWidth(parseInt(widthInput.value));
          processImage();
        };
        img.src = event.target.result;
      };
      if (e.target.files[0]) {
        reader.readAsDataURL(e.target.files[0]);
      }
    });

    presetSelect.addEventListener('change', () => {
      const val = presetSelect.value;
      if (val !== 'custom') {
        const size = parseInt(val);
        pixelSlider.value = size;
        sliderValue.textContent = size;
        if (aspectRatioCheck.checked && isImageLoaded) {
          widthInput.value = size;
          heightInput.value = Math.round(size / originalAspectRatio);
        } else {
          widthInput.value = size;
          heightInput.value = size;
        }
      }
      if (isImageLoaded) processImage();
    });

    pixelSlider.addEventListener('input', () => {
      const val = parseInt(pixelSlider.value);
      sliderValue.textContent = val;
      presetSelect.value = 'custom';
      updateDimensionsFromWidth(val);
      if (isImageLoaded) processImage();
    });

    widthInput.addEventListener('input', () => {
      const w = parseInt(widthInput.value) || 16;
      presetSelect.value = 'custom';
      pixelSlider.value = Math.min(Math.max(w, 8), 256);
      sliderValue.textContent = pixelSlider.value;
      
      if (aspectRatioCheck.checked && isImageLoaded) {
        heightInput.value = Math.max(1, Math.round(w / originalAspectRatio));
      }
      if (isImageLoaded) processImage();
    });

    heightInput.addEventListener('input', () => {
      const h = parseInt(heightInput.value) || 16;
      presetSelect.value = 'custom';
      if (aspectRatioCheck.checked && isImageLoaded) {
        widthInput.value = Math.max(1, Math.round(h * originalAspectRatio));
        pixelSlider.value = Math.min(Math.max(widthInput.value, 8), 256);
        sliderValue.textContent = pixelSlider.value;
      }
      if (isImageLoaded) processImage();
    });

    function updateDimensionsFromWidth(w) {
      widthInput.value = w;
      if (aspectRatioCheck.checked && isImageLoaded) {
        heightInput.value = Math.max(1, Math.round(w / originalAspectRatio));
      }
    }

    function getNearestColor(r, g, b) {
      let minDistance = Infinity;
      let nearestColor = rgbPalette[0];

      for (let i = 0; i < rgbPalette.length; i++) {
        const pr = rgbPalette[i][0];
        const pg = rgbPalette[i][1];
        const pb = rgbPalette[i][2];

        const distance = Math.sqrt((r - pr) ** 2 + (g - pg) ** 2 + (b - pb) ** 2);

        if (distance < minDistance) {
          minDistance = distance;
          nearestColor = rgbPalette[i];
        }
      }
      return nearestColor;
    }

    function processImage() {
      if (!isImageLoaded) return;

      const targetW = parseInt(widthInput.value) || 32;
      const targetH = parseInt(heightInput.value) || 32;

      resolutionInfo.textContent = `Aktif Çözünürlük: ${targetW} x ${targetH} px`;

      canvas.width = targetW;
      canvas.height = targetH;

      const tempCanvas = document.createElement('canvas');
      const tempCtx = tempCanvas.getContext('2d');
      tempCanvas.width = targetW;
      tempCanvas.height = targetH;

      tempCtx.drawImage(img, 0, 0, targetW, targetH);
      const imgData = tempCtx.getImageData(0, 0, targetW, targetH);
      const data = imgData.data;

      ctx.clearRect(0, 0, targetW, targetH);

      for (let y = 0; y < targetH; y++) {
        for (let x = 0; x < targetW; x++) {
          const idx = (y * targetW + x) * 4;
          const r = data[idx];
          const g = data[idx + 1];
          const b = data[idx + 2];
          const a = data[idx + 3];

          if (a < 128) continue;

          const [nr, ng, nb] = getNearestColor(r, g, b);
          ctx.fillStyle = `rgb(${nr}, ${ng}, ${nb})`;
          ctx.fillRect(x, y, 1, 1);
        }
      }
    }

    downloadNativeBtn.addEventListener('click', () => {
      if (!isImageLoaded) return alert("Lütfen önce bir görsel yükleyin!");
      const link = document.createElement('a');
      link.download = `pixel-art-${canvas.width}x${canvas.height}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    downloadHDBtn.addEventListener('click', () => {
      if (!isImageLoaded) return alert("Lütfen önce bir görsel yükleyin!");
      
      const hdCanvas = document.createElement('canvas');
      const hdCtx = hdCanvas.getContext('2d');
      
      const scale = Math.max(1, Math.floor(1024 / Math.max(canvas.width, canvas.height)));
      hdCanvas.width = canvas.width * scale;
      hdCanvas.height = canvas.height * scale;

      hdCtx.imageSmoothingEnabled = false;
      hdCtx.drawImage(canvas, 0, 0, hdCanvas.width, hdCanvas.height);

      const link = document.createElement('a');
      link.download = `pixel-art-HD-${hdCanvas.width}x${hdCanvas.height}.png`;
      link.href = hdCanvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
